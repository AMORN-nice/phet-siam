<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เพชรย้อม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@700&family=Chakra+Petch:wght@400;600;700&family=Pridi:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/siam/gem-red.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Home -->
<section id="home" class="screen">
  <div class="home-card lacquer">
    <h1 class="title">เพชรย้อม</h1>
    <p class="sub">สะสมอัญมณี สร้างกิจการ จนขุนนางมาเยือน เล่นได้ 2–5 คน</p>
    <label class="field">ชื่อของคุณ
      <input id="nameInput" maxlength="16" autocomplete="nickname">
    </label>
    <fieldset class="theme-pick">
      <legend>ธีมของห้อง</legend>
      <label class="theme-opt"><input type="radio" name="theme" value="siam" checked><img src="assets/siam/card-1-red.png" alt=""><span>สยามโบราณ</span></label>
      <label class="theme-opt"><input type="radio" name="theme" value="fantasy"><img src="assets/fantasy/card-1-red.png" alt=""><span>แฟนตาซี</span></label>
      <label class="theme-opt"><input type="radio" name="theme" value="scifi"><img src="assets/scifi/card-1-red.png" alt=""><span>ไซไฟอวกาศ</span></label>
    </fieldset>
    <button id="createBtn" class="btn primary">สร้างห้องใหม่</button>
    <div class="or">หรือเล่นคนเดียวกับบอท</div>
    <div class="join-row">
      <select id="botCount" aria-label="จำนวนบอท">
        <option value="1">บอท 1 ตัว</option>
        <option value="2">บอท 2 ตัว</option>
        <option value="3">บอท 3 ตัว</option>
        <option value="4">บอท 4 ตัว</option>
      </select>
      <button id="soloBtn" class="btn">เล่นกับบอท</button>
    </div>
    <div class="or">หรือเข้าห้องของเพื่อน</div>
    <div class="join-row">
      <input id="codeInput" maxlength="4" placeholder="รหัสห้อง" autocomplete="off" aria-label="รหัสห้อง">
      <button id="joinBtn" class="btn">เข้าห้อง</button>
    </div>
    <div id="claimBox" class="claim" hidden></div>
    <p id="homeErr" class="err" role="alert"></p>
  </div>
</section>

<!-- Lobby -->
<section id="lobby" class="screen" hidden>
  <div class="home-card lacquer">
    <h2 class="title small">ห้อง <span id="lobbyCode"></span></h2>
    <p id="lobbyTheme" class="sub theme-tag"></p>
    <p class="sub">ส่งลิงก์นี้ให้เพื่อนใน Discord</p>
    <div class="join-row">
      <input id="linkBox" readonly aria-label="ลิงก์ห้อง">
      <button id="copyBtn" class="btn">คัดลอก</button>
    </div>
    <ol id="lobbyPlayers" class="lobby-players"></ol>
    <button id="startBtn" class="btn primary" hidden>เริ่มเกม</button>
    <p id="lobbyWait" class="sub"></p>
    <div class="lobby-exit">
      <button id="leaveBtn" class="btn ghost" hidden>ออกจากห้อง</button>
      <button id="deleteBtn" class="btn ghost danger" hidden>ลบห้อง</button>
    </div>
    <p id="lobbyErr" class="err" role="alert"></p>
  </div>
</section>

<!-- Game -->
<section id="game" class="screen" hidden>
  <header id="opponents" class="opponents"></header>
  <main class="table">
    <div class="board">
      <div id="nobles" class="nobles" aria-label="ขุนนาง"></div>
      <div id="rows" class="rows"></div>
    </div>
    <aside class="bank-col">
      <div id="bank" class="bank" aria-label="กองอัญมณี"></div>
      <div class="take-area">
        <div id="takeBar" class="take-bar">
          <button id="takeBtn" class="btn primary">หยิบ</button>
          <button id="clearBtn" class="btn ghost">ล้าง</button>
        </div>
        <p id="takeHint" class="take-hint" aria-live="polite"></p>
      </div>
      <ol id="log" class="log" aria-live="polite"></ol>
    </aside>
  </main>
  <footer id="me" class="me lacquer"></footer>
  <div id="banner" class="banner" role="status"></div>
</section>

<!-- Modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-box lacquer" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" role="alert"></div>
<button id="muteBtn" class="btn mute" aria-pressed="false">เสียง: เปิด</button>

<script src="/socket.io/socket.io.js"></script>
<script src="sfx.js"></script>
<script src="app.js"></script>
</body>
</html>
